[package]
name = "phonecase-diy-gy"
version = "2.0.1"
edition = "2021"

[lib]
name = "phonecase_diy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
phonecase-core = { path = "../../phonecase-core" }

log = "0.4.33"
clap = "4.6.1"
config = "0.15.25"
shadow-rs = { version = "2.0.0", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

tauri = { version = "2.11.5", features = ["protocol-asset"] }
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"

[build-dependencies]
shadow-rs = "2.0.0"
tauri-build = { version = "2.6.3", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
