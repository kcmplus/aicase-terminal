name: Release existing build
run-name: Release ${{ inputs.release_tag }} from build ${{ inputs.run_id }}

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Successful main push build run ID (e.g. 42194105926)'
        required: true
        type: string
      release_tag:
        description: 'New release tag, e.g. v0.1.2 (original ZIP version stays unchanged)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-existing-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN_ID: ${{ inputs.run_id }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Validate release request
        run: |
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || { echo '::error::Select main.'; exit 1; }
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo '::error::Enter a numeric run ID.'; exit 1; }
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo '::error::Enter a stable release tag such as v0.1.2.'; exit 1; }
          count=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$RELEASE_TAG" | jq --arg ref "refs/tags/$RELEASE_TAG" '[.[] | select(.ref == $ref)] | length')
          [[ "$count" == 0 ]] || { echo '::error::Tag already exists; choose a new release tag.'; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Find original successful build artifact
        id: source
        run: |
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN_ID" > "$RUNNER_TEMP/source-run.json"
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/source-artifacts.json"
          python3 scripts/verify_existing_release.py select
      - name: Download original ZIP without rebuilding
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          artifact-ids: ${{ steps.source.outputs.artifact_id }}
          path: release
          skip-decompress: true
      - name: Verify original bytes and build metadata
        env:
          ARTIFACT_NAME: ${{ steps.source.outputs.artifact_name }}
          EXPECTED_SHA256: ${{ steps.source.outputs.sha256 }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: python3 scripts/verify_existing_release.py verify
      - name: Publish original ZIP at its source commit
        env:
          ARTIFACT_NAME: ${{ steps.source.outputs.artifact_name }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          gh release create "$RELEASE_TAG" "release/$ARTIFACT_NAME" \
            --target "$SOURCE_COMMIT" --draft \
            --title "POPOMO Terminal $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/existing-release-notes.md"
          gh release edit "$RELEASE_TAG" --draft=false
          printf 'Release: %s/%s/releases/tag/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
