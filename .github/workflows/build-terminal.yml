name: Build supplier integration package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      language:
        description: 'Default display language'
        required: true
        default: en-US
        type: choice
        options: [en-US, zh-CN]

permissions:
  contents: read

concurrency:
  group: terminal-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-name: ${{ steps.package.outputs.name }}
      artifact-sha256: ${{ steps.package.outputs.sha256 }}
    env:
      VITE_DEFAULT_LANGUAGE: ${{ inputs.language || vars.VITE_DEFAULT_LANGUAGE || 'en-US' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            supplier-host/package-lock.json
      - name: Check release tag matches package version
        if: github.ref_type == 'tag'
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const version=JSON.parse(fs.readFileSync('package.json','utf8')).version; if(process.env.GITHUB_REF_NAME !== 'v'+version) throw new Error('Tag must match package.json version');"
      - name: Install terminal dependencies
        run: npm ci
      - name: Install supplier UI dependencies
        run: npm --prefix supplier-host ci
      - name: Check supplier contract and tests
        run: npm test
      - name: Build and package supplier integration
        id: package
        run: npm run package:supplier
      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium
      - name: Check integrated UI and display-only behavior
        run: npm run test:supplier
      - name: Upload supplier integration ZIP
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: ${{ steps.package.outputs.path }}
          archive: false
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download verified supplier integration package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release
          skip-decompress: true
      - name: Publish release with supplier integration ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact-name }}
          EXPECTED_SHA256: ${{ needs.build.outputs.artifact-sha256 }}
        run: |
          zip_path="release/$ARTIFACT_NAME"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$zip_path" | sha256sum --check
          cp docs/RELEASE_NOTES.md "$RUNNER_TEMP/terminal-release-notes.md"
          printf '\nCommit: %s\n\nSHA256: %s\n' "$GITHUB_SHA" "$EXPECTED_SHA256" >> "$RUNNER_TEMP/terminal-release-notes.md"
          args=(--verify-tag --title "POPOMO Terminal $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/terminal-release-notes.md")
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "$zip_path" "${args[@]}"
