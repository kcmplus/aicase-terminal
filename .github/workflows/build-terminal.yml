name: Build terminal frontend

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      storefront_url:
        description: 'Public mobile-site URL; leave empty to use the device h5_base_url'
        required: false
        type: string
      language:
        description: 'Default display language'
        required: true
        default: en-US
        type: choice
        options: [en-US, zh-CN]

permissions:
  contents: read

concurrency:
  group: terminal-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VITE_STOREFRONT_URL: ${{ inputs.storefront_url || vars.VITE_STOREFRONT_URL || '' }}
      VITE_DEFAULT_LANGUAGE: ${{ inputs.language || vars.VITE_DEFAULT_LANGUAGE || 'en-US' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check supplier contract and tests
        run: npm test
      - name: Compile frontend
        run: npm run build
      - name: Package compiled files
        id: package
        run: python3 scripts/package.py
      - name: Upload frontend ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: ${{ steps.package.outputs.path }}
          archive: false
          if-no-files-found: error
          retention-days: 30
